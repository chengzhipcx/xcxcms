{% extends "base.html" %}
{% block title %}分类编辑 - CMS 后台管理{% endblock %}
{% block nav_type %}active{% endblock %}
{% block pagehead %}分类编辑{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 col-md-offset-3">
        {% if error %}
        <div class="alert alert-danger">{{ error|e }}</div>
        {% endif %}

        <div class="box box-primary">
            <div class="box-header with-border">
                <h3 class="box-title">{{ '编辑分类' if t else '增加分类' }}</h3>
            </div>

            <form method="post" action="{{ ctx }}/type/save" role="form">
                <div class="box-body">
                    <div class="form-group">
                        <label>标题 <span class="text-red">*</span></label>
                        <input type="text" class="form-control" placeholder="请输入分类标题" name="title" value="{{ t.title|e if t else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label>权重</label>
                        <input type="number" class="form-control" placeholder="数字越小排序越靠前" name="weight" value="{{ t.weight if t else '' }}" style="width: 200px;">
                    </div>
                    <input type="hidden" name="id" value="{{ t.id if t else 0 }}">
                </div>
                <div class="box-footer">
                    <button type="submit" class="btn btn-primary">提交</button>
                    <a class="btn btn-default" href="{{ ctx }}/type/home">返回</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
