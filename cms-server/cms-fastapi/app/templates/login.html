<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CMS 后台管理 - 登录</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <link rel="stylesheet" href="{{ ctx }}/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ ctx }}/css/AdminLTE.min.css">
    <link rel="stylesheet" href="{{ ctx }}/css/blue.css">
    <link rel="stylesheet" href="{{ ctx }}/css/index.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo">
        <a href="#"><b>CMS</b> 后台管理</a>
    </div>

    <div class="login-box-body">
        {% if msg %}
        <p class="login-box-msg" style="color: red;">{{ msg|e }}</p>
        {% else %}
        <p class="login-box-msg">请登录后开始管理</p>
        {% endif %}

        <form action="{{ ctx }}/user/login" method="post">
            <div class="form-group has-feedback">
                <input type="text" name="username" class="form-control" placeholder="用户名" required autofocus>
            </div>
            <div class="form-group has-feedback">
                <input type="password" name="password" class="form-control" placeholder="密码" required>
            </div>
            <div class="row">
                <button type="submit" class="btn btn-primary btn-block btn-flat">登 录</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
