# MySQL 连接配置
# 1. 先用项目根目录下的 cms.sql 初始化数据库（脚本会创建 weichatarticle 库及三张表并写入演示数据）
# 2. 按本机实际情况修改 url/username/password
# 3. MySQL 8.x 需将驱动类改为 com.mysql.cj.jdbc.Driver，并建议把 mysql-connector 换成 5.1.49 或 8.0.x
jdbc.driver=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/weichatarticle?useUnicode=true&characterEncoding=utf-8&useSSL=false
jdbc.username=root
jdbc.password=123456
