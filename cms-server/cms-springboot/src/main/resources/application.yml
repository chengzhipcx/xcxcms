server:
  port: 8080
  servlet:
    # 与 master 分支（传统 war 版）保持相同的上下文路径，小程序端 ROOT_URL 无需改动
    context-path: /cms
    session:
      # 后台会话 30 分钟无操作过期
      timeout: 30m
  error:
    # 使用 /WEB-INF/jsp/error.jsp 代替白标错误页
    whitelabel:
      enabled: false

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/weichatarticle?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 10

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ht.weichat.pojo

logging:
  level:
    com.ht.weichat.mapper: info

app:
  # 服务端对外地址（含上下文路径），用于拼接图片完整 URL 返回给小程序端
  # 线上部署改为 https://你的域名/cms
  ip: http://localhost:8080/cms
  # 文章图片上传目录（相对路径基于运行目录；内嵌容器下不再写入 war 内部，重启不丢图）
  upload-dir: uploads
